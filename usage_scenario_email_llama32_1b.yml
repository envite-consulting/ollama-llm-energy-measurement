name: Energy Measurement Ollama
author: envite Consulting GmbH <ruessmann|wittrowski|kepes@envite.de>
description: usage_scenario for Energy Measurement Ollama

compose-file: !include docker-compose.yml

services:
  gcb-ai-model:
    docker-run-args:
      - --gpus=all

flow:
  - name: Download llama3.2 1b
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama pull llama3.2:1b
        read-notes-stdout: true
        log-stdout: true

  - name: Run test run
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama run llama3.2:1b "Tell me a long joke?"
        log-stdout: false
        log-stderr: true

  - name: Run second test run
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama run llama3.2:1b "Tell me a long joke?"
        log-stdout: false
        log-stderr: true

  - name: Run email generation prompt with length condition 16 words
    container: gcb-ai-model
    commands:
      - type: console
        command: >-
          ollama run llama3.2:1b 'Write an email request with the data provided in the following JSON for the given subject. The email must be exactly \{\{lengthInWords\}\} words, with a tolerance of ±10%. Do not include a subject line. Output only the email body, clearly stating the request in a professional tone. Here is the data. { "subject": "request to work remotely on given date", "recipient": "manager", "reason": "family emergency", "date": "2025-10-01", "lengthInWords": 16 }' --nowordwrap
        log-stdout: true

  - name: Run email generation prompt with length condition 32 words

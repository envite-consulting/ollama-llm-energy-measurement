          ollama run llama3.2:1b 'Write an email request with the data provided in the following JSON for the given subject. The email must be exactly \{\{lengthInWords\}\} words, with a tolerance of ±10%. Do not include a subject line. Output only the email body, clearly stating the request in a professional tone. Here is the data. { "subject": "request to work remotely on given date", "recipient": "manager", "reason": "family emergency", "date": "2025-10-01", "lengthInWords": 64 }' --nowordwrap

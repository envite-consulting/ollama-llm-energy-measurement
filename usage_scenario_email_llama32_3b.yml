name: Energy Measurement Ollama
author: envite Consulting GmbH <ruessmann|wittrowski|kepes@envite.de>
description: usage_scenario for Energy Measurement Ollama

compose-file: !include docker-compose.yml

services:
  gcb-ai-model:
    docker-run-args:
      - --gpus=all

flow:
  - name: Download llama3.2 3b
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama pull llama3.2:3b
        log-stdout: false
        log-stderr: true

  - name: Run test run
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama run llama3.2:3b "Tell me a long joke?"
        log-stdout: false
        log-stderr: true

  - name: Run second test run
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama run llama3.2:3b "Tell me a long joke?"
        log-stdout: false
        log-stderr: true

  - name: Run email generation prompt with length condition 16 words
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama run llama3.2:3b "Write an email to your manager explaining that you will work remotely tomorrow due to a family emergency. The email must be exactly 16 words, with a tolerance of ±10%. Do not include a subject line. Output only the email body, clearly stating the request in a professional tone."  --nowordwrap 
        log-stdout: true

  - name: Run email generation prompt with length condition 32 words
    container: gcb-ai-model
    commands:
      - type: console
        command: ollama run llama3.2:3b "Write an email to your manager explaining that you will work remotely tomorrow due to a family emergency. The email must be exactly 32 words, with a tolerance of ±10%. Do not include a subject line. Output only the email body, clearly stating the request in a professional tone."  --nowordwrap 
        log-stdout: true


      - type: console
        command: ollama run llama3.2:3b "Write an email to your manager explaining that you will work remotely tomorrow due to a family emergency. The email must be exactly 128 words, with a tolerance of ±10%. Do not include a subject line. Output only the email body, clearly stating the request in a professional tone."  --nowordwrap 
        log-stdout: true

  - name: Run email generation prompt with length condition 256 words
